{% extends "base.html" %}

{% block appbar %}
<style>
  /* White header */
  .appbar{
    background:#fff !important;
    border-bottom: 1px solid rgba(0,0,0,0.06) !important;
    backdrop-filter:none !important;
    display:grid !important;
    grid-template-columns: 44px 1fr 44px;
    align-items:center;
  }
  .navicon{
    background:transparent !important;
    border:none !important;
    box-shadow:none !important;
    width:44px !important;
    height:44px !important;
    border-radius:0 !important;
    padding:0 !important;
    color:#111 !important;
    display:flex; align-items:center; justify-content:center;
  }
  .h1{ text-align:center; }
</style>

  <a class="navicon" href="{{ url_for('reviews.add_review') }}" aria-label="Back">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </a>
  <div class="h1">Add New Book</div>
  <div aria-hidden="true"></div>
{% endblock %}

{% block content %}
<style>
  .wrap{
    padding: 14px 16px 28px;
    max-width: 520px;
    margin: 0 auto;
  }

  form{ display:flex; flex-direction:column; gap:16px; }

  .field{ display:flex; flex-direction:column; gap:8px; }
  .label{
    font-size:16px;
    font-weight:550;
    color:#111;
  }

  /* white pill inputs */
  .input{
    height:52px;
    border-radius:14px;
    border:1px solid rgba(0,0,0,0.06);
    background:#fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    padding:0 16px;
    font-size:15px;
    color:#111;
    font-family: inherit;

    outline:0 !important;
    -webkit-appearance:none;
    appearance:none;
  }
  .input::placeholder{ color: rgba(0,0,0,0.35); }

  /* Open Library section */
  .ol{
    margin-bottom:14px;
    width:100%;
  }

  /* Search pill  */
  .f-search{
    display:flex;
    align-items:center;
    gap:10px;
    height:40px;                
    padding:0 14px;
    border-radius:14px;
    background:#fff;
    border:1px solid rgba(0,0,0,0.06);
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    width:100%;
  }
  .f-search .icon{
    width:18px;
    height:18px;
    color: rgba(0,0,0,0.45);
    flex:0 0 18px;
  }
  .f-search input{
    width:100%;
    border:0 !important;
    outline:0 !important;
    background:transparent !important;
    box-shadow:none !important;
    -webkit-appearance:none;
    appearance:none;
    font-size:15px;
    font-family:inherit;
    color:#111;
    padding:0 !important;
    margin:0 !important;
  }
  .f-search input::placeholder{
    color: rgba(0,0,0,0.45);
  }

  /* Select matches pill style */
  select.input{
    padding-right:42px;
    background:
      #fff
      url('data:image/svg+xml;utf8,<svg fill="none" stroke="black" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polyline points="6 9 12 15 18 9"/></svg>')
      no-repeat right 14px center/16px;
  }

  /* Review textarea big box */
  .textarea{
    min-height:170px;
    padding:14px 16px;
    border-radius:16px;
    border:1px solid rgba(0,0,0,0.06);
    background:#fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    font-size:15px;
    font-family:inherit;          
    resize:none;
    outline:0 !important;
  }
  .textarea::placeholder{ color: rgba(0,0,0,0.35); }

  /* Stars bar container */
  .stars-wrap{
    height:52px;
    border-radius:16px;
    border:1px solid rgba(0,0,0,0.06);
    background:#fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:0 12px;
  }

  .star-btn{
    width:28px; height:28px;
    border:0;
    background:transparent;
    padding:0;
    cursor:pointer;
    color: rgba(0,0,0,0.22);
  }
  .star-btn.active{ color:#111; }

  /* Buttons row */
  .btn-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:6px;
  }

  .btn{
    height:52px;
    border-radius:10px;
    border:0;
    background:#111;
    color:#fff;
    font-weight:650;
    font-size:16px;
    cursor:pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.10);
  }
  .btn:active{ opacity:.92; }

  .results{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:10px;
  }

  .result{
    display:flex;
    gap:10px;
    align-items:center;
    padding:10px 12px;
    border:1px solid rgba(0,0,0,0.06);
    border-radius:14px;
    background:#fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    cursor:pointer;
  }
  .result:active{ opacity:.92; }

  .thumb{
    width:44px; height:60px;
    border-radius:12px;
    background: rgba(0,0,0,0.06);
    object-fit:cover;
    flex:0 0 auto;
  }
  .rmeta{ flex:1; min-width:0; }
  .rtitle{
    font-size:14px;
    color:#111;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .rauthor{
    font-size:12px;
    color: rgba(0,0,0,0.45);
    margin-top:4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pill{
    font-size:12px;
    color: rgba(0,0,0,0.45);
    padding:4px 8px;
    border:1px solid rgba(0,0,0,0.06);
    border-radius:999px;
    background:#fff;
    flex:0 0 auto;
  }
</style>

<div class="wrap">

  <!-- Open Library Search -->
  <div class="ol">
    <div class="f-search">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="ol_q" type="text" placeholder="Search" autocomplete="off">
    </div>

    <div id="ol_results" class="results" aria-live="polite"></div>
  </div>

  <!-- Form -->
  <form id="bookForm" action="{{ url_for('books.add_book') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field">
      <label class="label">Title</label>
      <input id="title" class="input" type="text" name="title" placeholder="Enter Title..." required>
    </div>

    <div class="field">
      <label class="label">Author</label>
      <input id="author" class="input" type="text" name="author" placeholder="Enter Author..." required>
    </div>

    <div class="field">
      <label class="label">Genre</label>
      <select id="genre" class="input" name="genre" required>
        {% for g in genres %}
          <option value="{{ g }}">{{ g }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Review box -->
    <textarea id="review" name="review" class="textarea" placeholder="Write your review..."></textarea>

    <!-- Stars -->
    <input type="hidden" id="rating" name="rating" value="0">
    <div class="stars-wrap" aria-label="Rating">
      {% for i in range(1,6) %}
      <button type="button" class="star-btn" data-v="{{ i }}" aria-label="{{ i }} stars">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
          <path d="M12 17.27l5.18 3.05-1.64-5.81L20 10.24l-6.02-.52L12 4 10.02 9.72 4 10.24l4.46 4.27-1.64 5.81L12 17.27z"/>
        </svg>
      </button>
      {% endfor %}
    </div>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn" type="submit">Submit Review</button>
      <button class="btn" type="button" id="clearBtn">Clear Review</button>
    </div>

  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
(function(){
  const q = document.getElementById('ol_q');
  const results = document.getElementById('ol_results');

  const title = document.getElementById('title');
  const author = document.getElementById('author');

  const review = document.getElementById('review');
  const ratingInput = document.getElementById('rating');
  const clearBtn = document.getElementById('clearBtn');

  let timer = null;

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function render(items){
    results.innerHTML = '';
    if (!items || items.length === 0){
      // keep clean 
      return;
    }

    results.innerHTML = items.map((b, i) => {
      const img = b.cover ? `<img class="thumb" src="${escapeHtml(b.cover)}" alt="">`
                          : `<div class="thumb" aria-hidden="true"></div>`;
      const yr = b.year ? `<span class="pill">${escapeHtml(b.year)}</span>` : '';
      return `
        <div class="result" data-i="${i}">
          ${img}
          <div class="rmeta">
            <div class="rtitle">${escapeHtml(b.title)}</div>
            <div class="rauthor">${escapeHtml(b.author)}</div>
          </div>
          ${yr}
        </div>
      `;
    }).join('');

    Array.from(results.querySelectorAll('.result')).forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.getAttribute('data-i'), 10);
        const b = items[idx] || {};
        title.value = b.title || '';
        author.value = b.author || '';
        title.scrollIntoView({behavior:'smooth', block:'center'});
      });
    });
  }

  async function search(){
    const term = q.value.trim();
    if (term.length < 2){
      results.innerHTML = '';
      return;
    }
    try{
      const res = await fetch(`/api/openlibrary?q=${encodeURIComponent(term)}`);
      const data = await res.json();
      render(data);
    }catch(e){
      // keep it clean
      results.innerHTML = '';
    }
  }

  q.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(search, 250);
  });

  // Stars
  const starBtns = Array.from(document.querySelectorAll('.star-btn'));
  function paint(v){
    starBtns.forEach(btn => {
      const n = Number(btn.dataset.v);
      btn.classList.toggle('active', n <= v);
    });
  }
  starBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const v = Number(btn.dataset.v || 0);
      ratingInput.value = String(v);
      paint(v);
    });
  });
  paint(Number(ratingInput.value || 0));

  // Clear
  clearBtn.addEventListener('click', () => {
    title.value = '';
    author.value = '';
    review.value = '';
    ratingInput.value = '0';
    paint(0);
    q.value = '';
    results.innerHTML = '';
    title.scrollIntoView({behavior:'smooth', block:'center'});
  });
})();
</script>
{% endblock %}
