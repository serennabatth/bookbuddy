{% extends "base.html" %}

{% block appbar %}
<style>
  /* White header */
  .appbar{
    background:#fff !important;
    border-bottom:1px solid rgba(0,0,0,0.06) !important;
    backdrop-filter:none !important;
    display:grid !important;
    grid-template-columns:44px 1fr 44px;
    align-items:center;
  }
  .navicon{
    background:transparent !important;
    border:none !important;
    box-shadow:none !important;
    width:44px !important;
    height:44px !important;
    border-radius:0 !important;
    padding:0 !important;
    color:#111 !important;
    display:flex; align-items:center; justify-content:center;
  }
  .h1{ text-align:center; }
</style>

  <a class="navicon" href="{{ url_for('home') }}" aria-label="Back">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </a>
  <div class="h1">Add Review</div>
  <div aria-hidden="true"></div>
{% endblock %}

{% block content %}
<style>
  .wrap{
    padding: 14px 16px 28px;
    max-width: 520px;
    margin: 0 auto;
  }

  /* Search pill  */
  .f-search{
    display:flex;
    align-items:center;
    gap:10px;
    height:44px;
    padding:0 14px;
    border-radius:14px;
    background:#fff;
    border:1px solid rgba(0,0,0,0.06);
    box-shadow:0 6px 18px rgba(0,0,0,0.06);
  }
  .f-search .icon{ width:18px; height:18px; color: rgba(0,0,0,0.45); flex:0 0 18px; }
  .f-search input{
    width:100%;
    border:0 !important;
    outline:0 !important;
    background:transparent !important;
    box-shadow:none !important;
    -webkit-appearance:none;
    appearance:none;
    font-size:15px;
    font-family:inherit;
    color:#111;
    padding:0 !important;
    margin:0 !important;
  }
  .f-search input::placeholder{ color: rgba(0,0,0,0.45); }

  /* Cards  */
  .card{
    background:#fff;
    border:1px solid rgba(0,0,0,0.06);
    border-radius:16px;
    box-shadow:0 6px 18px rgba(0,0,0,0.06);
    overflow:hidden;
  }

  .stack{ display:flex; flex-direction:column; gap:14px; margin-top:14px; }

  /* Rows */
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 12px;
    cursor:pointer;
    text-decoration:none;
    color:inherit;
  }
  .row + .row{ border-top:1px solid rgba(0,0,0,0.08); }

  .thumb{
    width:54px; height:54px;
    border-radius:12px;
    background: rgba(0,0,0,0.06);
    overflow:hidden;
    flex:0 0 54px;
    display:flex; align-items:center; justify-content:center;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

  .meta{ flex:1; min-width:0; }
  .title{
    font-size:16px;
    font-weight:650;
    color:#111;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    line-height:1.2;
  }
  .sub{
    font-size:13px;
    color: rgba(0,0,0,0.55);
    margin-top:4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .chev{
    width:20px; height:20px;
    color: rgba(0,0,0,0.55);
    flex:0 0 20px;
  }

  .plus{ width:22px; height:22px; color:#111; }

  /* Selected book card */
  .sel-top{ display:flex; gap:14px; align-items:center; padding:14px; }
  .sel-cover{
    width:64px; height:84px;
    border-radius:14px;
    background: rgba(0,0,0,0.06);
    overflow:hidden;
    flex:0 0 64px;
  }
  .sel-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .sel-meta{ flex:1; min-width:0; }
  .sel-rating{
    margin-top:8px;
    font-size:13px;
    color: rgba(0,0,0,0.45);
  }

  /* Review box card */
  .reviewbox{ padding:14px; }
  .reviewbox textarea{
    width:100%;
    min-height:190px;
    border:none !important;
    outline:none !important;
    box-shadow:none !important;
    background:transparent !important;
    resize:none;
    font-size:15px;
    font-family:inherit;
    color:#111;
    padding:0 !important;
    margin:0 !important;
    -webkit-appearance:none;
    appearance:none;
  }
  .reviewbox textarea::placeholder{ color: rgba(0,0,0,0.35); }

  /* Stars card */
  .starswrap{
    height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:0 14px;
  }
  .star{
    width:26px; height:26px;
    color: rgba(0,0,0,0.20);
    cursor:pointer;
  }
  .star.active{ color:#111; }

  /* Buttons */
  .btn-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-top:8px;
  }
  .btn{
    height:52px;
    border-radius:10px;
    border:0;
    background:#111;
    color:#fff;
    font-weight:650;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.10);
  }
  .btn:active{ opacity:.92; }

  /* Dropdown */
  .dropdown{ position:relative; display:none; }
  .dropdown.open{ display:block; }

  .hint{
    padding:12px;
    font-size:13px;
    color: rgba(0,0,0,0.50);
  }

  /* helper hide */
  .is-hidden{ display:none !important; }
</style>

<div class="wrap">

  <!-- Search -->
  <div class="f-search">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input id="searchInput" type="text" placeholder="Search for a book" autocomplete="off">
  </div>

  <div class="stack">

    <!-- TOP CARD -->
    <div class="card">
      <div id="topResult" class="row" style="display:none;">
        <div class="thumb"><img id="topCover" alt=""></div>
        <div class="meta">
          <div class="title" id="topTitle"></div>
          <div class="sub" id="topAuthor"></div>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>

      <!-- ✅ This stays on the page, BUT we hide it while dropdown is open -->
      <a id="addBookRow" class="row" href="{{ url_for('add_book') }}">
        <div class="thumb" aria-hidden="true">
          <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <div class="meta">
          <div class="sub" style="font-size:15px; color:rgba(0,0,0,0.55); margin:0;">Add New Book</div>
        </div>
      </a>

      <!-- Dropdown list -->
      <div id="dropdown" class="dropdown">
        <div id="ddList"></div>
        <div id="ddEmpty" class="hint" style="display:none;">No matches. Try another title/author.</div>
      </div>
    </div>

    <!-- SELECTED BOOK CARD -->
    <div id="selectedCard" class="card" style="display:none;">
      <div class="sel-top">
        <div class="sel-cover"><img id="selCover" alt=""></div>
        <div class="sel-meta">
          <div class="title" id="selTitle"></div>
          <div class="sub" id="selAuthor"></div>
          <div class="sel-rating" id="selAvg"></div>
        </div>
      </div>
    </div>

    <!-- REVIEW BOX -->
    <div class="card reviewbox">
      <textarea id="reviewText" placeholder="Write your review..." required></textarea>
    </div>

    <!-- STARS -->
    <div class="card">
      <div class="starswrap" id="starRow" role="radiogroup" aria-label="Rating">
        {% for i in range(1,6) %}
          <svg class="star" data-val="{{ i }}" viewBox="0 0 24 24" fill="currentColor" aria-label="{{ i }} star" tabindex="0">
            <path d="M12 17.27l5.18 3.09-1.64-5.81L20.5 9.5l-6-.26L12 4 9.5 9.24l-6 .26 4.96 4.05-1.64 5.81L12 17.27z"/>
          </svg>
        {% endfor %}
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="btn-row">
      <button class="btn" id="submitBtn" type="button">Submit Review</button>
      <button class="btn" id="clearBtn" type="button">Clear Review</button>
    </div>

  </div>

  <!-- hidden real post form -->
  <form id="postForm" action="{{ url_for('add_review') }}" method="post" style="display:none;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="book_title" id="bookTitle">
    <input type="hidden" name="book_id" id="bookId">
    <input type="hidden" name="review" id="reviewField">
    <input type="hidden" name="rating" id="ratingField" value="0">
  </form>

</div>

<script id="book-data" type="application/json">{{ books|tojson|safe }}</script>

<script>
  const BOOKS = JSON.parse(document.getElementById('book-data').textContent) || [];
  const PLACEHOLDER = "https://placehold.co/400x600/EEE/AAA?text=No+Cover";
  const CHEVRON_SVG = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>';

  const input = document.getElementById('searchInput');

  const dropdown = document.getElementById('dropdown');
  const ddList = document.getElementById('ddList');
  const ddEmpty = document.getElementById('ddEmpty');

  const topResult = document.getElementById('topResult');
  const topCover = document.getElementById('topCover');
  const topTitle = document.getElementById('topTitle');
  const topAuthor = document.getElementById('topAuthor');

  const addBookRow = document.getElementById('addBookRow');

  const selectedCard = document.getElementById('selectedCard');
  const selTitle = document.getElementById('selTitle');
  const selAuthor = document.getElementById('selAuthor');
  const selCover = document.getElementById('selCover');
  const selAvg = document.getElementById('selAvg');

  const reviewText = document.getElementById('reviewText');
  const submitBtn = document.getElementById('submitBtn');
  const clearBtn = document.getElementById('clearBtn');

  const bookTitleField = document.getElementById('bookTitle');
  const bookIdField = document.getElementById('bookId');
  const reviewField = document.getElementById('reviewField');
  const ratingField = document.getElementById('ratingField');

  // Stars
  const stars = Array.from(document.querySelectorAll('.star'));
  let rating = 0;

  function paintStars(){
    stars.forEach((s, i) => s.classList.toggle('active', i < rating));
  }

  stars.forEach((s, i) => {
    s.addEventListener('click', () => { rating = i + 1; paintStars(); });
    s.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); rating = i + 1; paintStars(); }
    });
  });


  function openDropdown(){
    dropdown.classList.add('open');
    // ✅ Hide Add New Book row while dropdown is open (so it’s NOT part of the “search results” view)
    addBookRow.classList.add('is-hidden');
  }

  function closeDropdown(){
    dropdown.classList.remove('open');
    addBookRow.classList.remove('is-hidden');
  }

  function renderList(q){
    ddList.innerHTML = '';
    const term = (q || '').trim().toLowerCase();

    const results = BOOKS
      .filter(b => {
        const t = (b.title || '').toLowerCase();
        const a = (b.author || '').toLowerCase();
        return t.includes(term) || a.includes(term);
      })
      .slice(0, 12);

    // Top result row
    if (results.length){
      const b = results[0];
      topCover.src = (b.cover || '').trim() || PLACEHOLDER;
      topCover.onerror = () => { topCover.src = PLACEHOLDER; };
      topTitle.textContent = b.title || '';
      topAuthor.textContent = b.author || '';
      topResult.style.display = 'flex';
      topResult.onclick = () => selectBook(b);
    } else {
      topResult.style.display = 'none';
    }

    ddEmpty.style.display = (term && !results.length) ? 'block' : 'none';

    // ✅ CRITICAL: render ONLY from 2nd result onward (prevents Gatsby appearing twice)
    results.forEach((b, idx) => {
      if (idx === 0) return;

      const row = document.createElement('div');
      row.className = 'row';
      row.tabIndex = 0;

      const cover = (b.cover || '').trim() || PLACEHOLDER;

      // Build the row from elements instead of an HTML string. textContent
      // and img.src treat book data as plain text, so a title or cover link
      // can never be run as code (this closes an XSS hole).
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const img = document.createElement('img');
      img.src = cover;
      img.alt = '';
      img.addEventListener('error', () => { img.src = PLACEHOLDER; }, { once: true });
      thumb.appendChild(img);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const titleEl = document.createElement('div');
      titleEl.className = 'title';
      titleEl.textContent = b.title || '';
      const subEl = document.createElement('div');
      subEl.className = 'sub';
      subEl.textContent = b.author || '';
      meta.append(titleEl, subEl);

      row.append(thumb, meta);
      // The chevron icon is fixed markup with no book data in it, so inserting it as HTML is safe.
      row.insertAdjacentHTML('beforeend', CHEVRON_SVG);

      row.addEventListener('click', () => selectBook(b));
      row.addEventListener('keydown', (e) => { if (e.key === 'Enter') selectBook(b); });

      ddList.appendChild(row);
    });

    openDropdown();
  }

  function selectBook(b){
    selectedCard.style.display = 'block';
    selTitle.textContent = b.title || '';
    selAuthor.textContent = b.author || '';
    selCover.src = (b.cover || '').trim() || PLACEHOLDER;
    selCover.onerror = () => { selCover.src = PLACEHOLDER; };

    const r = (b.rating ?? b.avg_rating ?? '');
    selAvg.textContent = r ? `${Number(r).toFixed(2)} avg rating` : '';

    bookTitleField.value = b.title || '';
    bookIdField.value = b.id || '';
    closeDropdown();
    input.value = '';
    input.blur();
  }

  // ✅ Only open dropdown when typing
  input.addEventListener('focus', () => {
    if (input.value.trim().length >= 1) renderList(input.value);
  });
  input.addEventListener('click', () => {
    if (input.value.trim().length >= 1) renderList(input.value);
  });
  input.addEventListener('input', (e) => {
    const v = e.target.value || '';
    if (v.trim().length >= 1) renderList(v);
    else closeDropdown();
  });

  document.addEventListener('click', (e) => {
    const inCard = e.target.closest('.card');
    if (!inCard && e.target !== input) closeDropdown();
  });

  // Buttons
  clearBtn.addEventListener('click', () => {
    reviewText.value = '';
    rating = 0;
    paintStars();
  });

  submitBtn.addEventListener('click', () => {
    if (!bookTitleField.value) { input.focus(); return; }

    const text = (reviewText.value || '').trim();
    if (!text) { reviewText.focus(); return; }

    if (!rating) {
      document.getElementById('starRow').scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }

    reviewField.value = text;
    ratingField.value = rating;
    document.getElementById('postForm').submit();
  });
</script>
{% endblock %}
